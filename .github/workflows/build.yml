# Builds the site on every push and pull request, so a broken edit to
# src/data.js is caught here before Vercel tries to deploy it.
name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check the pre-render actually ran
        run: |
          grep -q 'id="main"' dist/index.html
          grep -q 'https://anshuvo.onrender.com/' dist/projects/anshuvo/index.html
